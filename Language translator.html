
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Translation Tool</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #fdf2f8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 850px;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.10);
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    color: #5b45d6;
    font-size: 30px;
    margin-bottom: 10px;
}

header p {
    color: #777;
}

.language-row {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.language-box {
    flex: 1;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 9px;
    color: #333;
}

select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 15px;
    background: #fafafa;
}

.swap-btn {
    margin-top: 25px;
    border: none;
    background: #eeeaff;
    color: #5b45d6;
    font-size: 22px;
    padding: 10px 15px;
    border-radius: 50%;
    cursor: pointer;
}

.text-area {
    width: 100%;
    min-height: 150px;
    padding: 17px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    resize: vertical;
    outline: none;
    font-family: Arial, sans-serif;
}

.text-area:focus {
    border-color: #7259e8;
}

.counter {
    text-align: right;
    color: #888;
    font-size: 12px;
    margin-top: 7px;
}

.translate-btn {
    width: 100%;
    margin: 22px 0;
    padding: 15px;
    background: linear-gradient(90deg, #654de0, #9a57d9);
    border: none;
    color: white;
    font-size: 17px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
}

.translate-btn:hover {
    opacity: 0.9;
}

.translate-btn:disabled {
    opacity: 0.6;
    cursor: wait;
}

.output-box {
    background: #f7f5ff;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #e5dfff;
    min-height: 130px;
}

.output-box h3 {
    color: #5b45d6;
    margin-bottom: 13px;
}

#output {
    font-size: 17px;
    line-height: 1.6;
    color: #333;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.actions button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #e8e3ff;
    color: #553cc5;
    cursor: pointer;
    font-weight: bold;
}

.actions button:hover {
    background: #d8ceff;
}

#status {
    text-align: center;
    margin-top: 12px;
    color: #666;
    font-size: 14px;
}

footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 25px;
}

@media(max-width: 600px) {
    .container {
        padding: 20px;
    }

    .language-row {
        gap: 8px;
    }

    header h1 {
        font-size: 24px;
    }

    .swap-btn {
        padding: 8px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <h1>🌐 Language Translator</h1>
        <p>Translate words and sentences into different languages.</p>
    </header>

    <div class="language-row">

        <div class="language-box">
            <label>From Language</label>
            <select id="sourceLang">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="mr">Marathi</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh-CN">Chinese</option>
                <option value="ar">Arabic</option>
            </select>
        </div>

        <button class="swap-btn" onclick="swapLanguages()">
            ⇄
        </button>

        <div class="language-box">
            <label>To Language</label>
            <select id="targetLang">
                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="mr">Marathi</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh-CN">Chinese</option>
                <option value="ar">Arabic</option>
            </select>
        </div>

    </div>

    <label>Enter Text</label>

    <textarea
        id="inputText"
        class="text-area"
        placeholder="Enter text to translate..."
        maxlength="500"
        oninput="updateCounter()"
    ></textarea>

    <div class="counter" id="counter">0 / 500</div>

    <button class="translate-btn" id="translateBtn"
        onclick="translateText()">
        Translate Now →
    </button>

    <div class="output-box">

        <h3>Translated Text</h3>

        <div id="output">
            Your translated text will appear here...
        </div>

        <div class="actions">
            <button onclick="copyText()">📋 Copy</button>
            <button onclick="speakText()">🔊 Listen</button>
            <button onclick="clearText()">✖ Clear</button>
        </div>

    </div>

    <p id="status"></p>

    <footer>
        Language Translation Tool | Powered by MyMemory API
    </footer>

</div>

<script>

const input = document.getElementById("inputText");
const output = document.getElementById("output");
const statusText = document.getElementById("status");
const translateBtn = document.getElementById("translateBtn");

// Character counter
function updateCounter() {
    document.getElementById("counter").innerText =
        input.value.length + " / 500";
}

// Swap languages
function swapLanguages() {

    const source = document.getElementById("sourceLang");
    const target = document.getElementById("targetLang");

    const temp = source.value;

    source.value = target.value;
    target.value = temp;

    const translated = output.innerText;

    if (translated !== "Your translated text will appear here...") {
        input.value = translated;
        output.innerText = "Your translated text will appear here...";
        updateCounter();
    }
}

// Translation API
async function translateText() {

    const text = input.value.trim();

    const source = document.getElementById("sourceLang").value;
    const target = document.getElementById("targetLang").value;

    if (!text) {
        statusText.innerText = "Please enter some text!";
        return;
    }

    if (source === target) {
        statusText.innerText = "Select two different languages.";
        return;
    }

    // MyMemory supports a maximum of 500 bytes per request
    if (new TextEncoder().encode(text).length > 500) {
        statusText.innerText =
            "Text is too long. Please enter a shorter text (maximum 500 bytes).";
        return;
    }

    translateBtn.disabled = true;
    translateBtn.innerText = "Translating...";
    statusText.innerText = "Please wait...";

    output.innerText = "";

    try {

        const params = new URLSearchParams({
            q: text,
            langpair: source + "|" + target
        });

        const response = await fetch(
            "https://api.mymemory.translated.net/get?" + params
        );

        if (!response.ok) {
            throw new Error("API request failed: " + response.status);
        }

        const data = await response.json();

        if (Number(data.responseStatus) !== 200) {
            throw new Error(
                data.responseDetails || "Translation service error."
            );
        }

        const translatedText =
            data.responseData.translatedText;

        if (!translatedText) {
            throw new Error("No translation received.");
        }

        output.innerText = translatedText;
        statusText.innerText = "Translation completed successfully!";

    }
    catch (error) {

        output.innerText = "Translation unavailable.";

        statusText.innerText =
            "Error: " + error.message +
            " Please try again later.";

        console.error(error);
    }

    finally {
        translateBtn.disabled = false;
        translateBtn.innerText = "Translate Now →";
    }
}

// Copy translated text
async function copyText() {

    const text = output.innerText;

    if (
        !text ||
        text === "Your translated text will appear here..." ||
        text === "Translation unavailable."
    ) {
        statusText.innerText = "Nothing to copy!";
        return;
    }

    try {
        await navigator.clipboard.writeText(text);
        statusText.innerText = "Copied successfully!";
    } catch (error) {
        statusText.innerText = "Copy failed. Check browser permissions.";
    }
}

// Text-to-speech
function speakText() {

    const text = output.innerText;

    if (
        !text ||
        text === "Your translated text will appear here..." ||
        text === "Translation unavailable."
    ) {
        statusText.innerText = "No translated text to speak!";
        return;
    }

    if (!("speechSynthesis" in window)) {
        statusText.innerText = "Speech is not supported by this browser.";
        return;
    }

    const speech = new SpeechSynthesisUtterance(text);

    const target = document.getElementById("targetLang").value;

    const languageCodes = {
        en: "en-US",
        hi: "hi-IN",
        mr: "mr-IN",
        es: "es-ES",
        fr: "fr-FR",
        de: "de-DE",
        it: "it-IT",
        pt: "pt-PT",
        ru: "ru-RU",
        ja: "ja-JP",
        ko: "ko-KR",
        "zh-CN": "zh-CN",
        ar: "ar-SA"
    };

    speech.lang = languageCodes[target];
    speech.rate = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);

}

// Clear input and output
function clearText() {

    input.value = "";

    output.innerText =
        "Your translated text will appear here...";

    statusText.innerText = "";

    window.speechSynthesis.cancel();

    updateCounter();
}

</script>

</body>
</html>
